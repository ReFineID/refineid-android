#
# Dependabot configuration for daily version updates across Gradle, Cargo,
# and GitHub Actions workflows.

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: "cargo"
    directory: "/native/refineid-android-core"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: "cargo"
    directory: "/native/refineid-rapp-android"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
