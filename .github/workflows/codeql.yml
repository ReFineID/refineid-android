#
# CodeQL analysis for Java/Kotlin. The build requires cargo-ndk and the Rust
# Android cross-compilation targets, as well as a sibling checkout of
# refineid-core, so this workflow provides those steps explicitly rather than
# relying on autobuild.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Check out refineid-android
        uses: actions/checkout@v4
        with:
          path: refineid-android

      - name: Check out the sibling refineid-core
        uses: actions/checkout@v4
        with:
          repository: ReFineID/refineid-core
          path: refineid-core

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the pinned Android SDK platform and NDK
        working-directory: refineid-android
        run: |
          ndk_version=$(sed -n 's/^ *ndkVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          platform_api=$(sed -n 's/^val currentAndroidApi = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${sdkmanager}" --licenses > /dev/null || true
          "${sdkmanager}" "platforms;android-${platform_api}" ||
            "${sdkmanager}" "platforms;android-${platform_api}.0"
          "${sdkmanager}" "ndk;${ndk_version}"

      - name: Install the Rust Android targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          source-root: refineid-android

      - name: Build
        working-directory: refineid-android
        run: ./gradlew assemble

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
